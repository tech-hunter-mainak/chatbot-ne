title: "বিহু"

summary: >
  বিহু অসমৰ অন্যতম প্ৰধান উৎসৱ আৰু অসমীয়া সংস্কৃতিৰ এক গুৰুত্বপূৰ্ণ অংশ।

content: |
  বিহু অসমৰ অন্যতম জনপ্ৰিয় আৰু ঐতিহ্যবাহী উৎসৱ।
  বছৰত তিনিবাৰ বিহু পালন কৰা হয়—

  ১. ৰঙালী বিহু (বহাগ বিহু)
  ২. কাতি বিহু
  ৩. মাঘ বিহু

  ৰঙালী বিহু অসমীয়া নৱবৰ্ষৰ আৰম্ভণিৰ সৈতে জড়িত।
  এই সময়ত বিহু নৃত্য, বিহু গীত, গামোচা, ঢোল, পেঁপা আদি অসমৰ সংস্কৃতিৰ বিশেষ পৰিচয় বহন কৰে।

